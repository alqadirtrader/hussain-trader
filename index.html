<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🟢 Hussain Traders - Dynamic ERP & POS v10.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Noto+Nastaliq+Urdu:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: #0a0e17;
            --card-bg: rgba(20, 26, 40, 0.92);
            --text-color: #f1f1f1;
            --primary-accent: #00e676;
            --urdu-red: #ff5252;
            --header-bg: rgba(25, 33, 50, 0.9);
            --input-bg: #151c2c;
            --border-color: #2a364f;
        }

        body.dark-mode {
            --card-bg: rgba(15, 20, 30, 0.95);
            --text-color: #ffffff;
            --primary-accent: #00c853;
            --header-bg: #111723;
            --input-bg: #0d121d;
            --border-color: #232d42;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; transition: background 0.3s ease, color 0.3s ease; }

        body { 
            background: #080c14; 
            padding: 8px; 
            min-height: 100vh;
            color: var(--text-color);
            position: relative;
            overflow-x: hidden;
        }

        /* TRADING ANIMATED BACKGROUND CANVAS */
        #tradingBgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.85;
        }

        .container { 
            position: relative;
            z-index: 1;
            max-width: 1420px; margin: 0 auto; 
            background: var(--card-bg); 
            padding: 12px; border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
        }
        
        .brand-logo { height: 95px; width: auto; object-fit: contain; }
        
        .urdu-title-main {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 42px;
            font-weight: bold;
            color: var(--urdu-red) !important;
            text-align: center;
            line-height: 1.6;
            text-shadow: 2px 2px 8px rgba(255, 82, 82, 0.3);
        }

        /* LOGIN SCREEN OVERLAY */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 15, 0.92);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; padding: 15px;
            backdrop-filter: blur(10px);
        }

        .login-card {
            background: rgba(16, 23, 38, 0.96);
            padding: 24px; border-radius: 16px; width: 100%; max-width: 440px;
            text-align: center; border: 1px solid rgba(0, 230, 118, 0.3); color: #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(0,230,118,0.15);
        }

        .login-slider-box {
            width: 100%;
            height: 140px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid var(--primary-accent);
            position: relative;
        }

        .login-slider-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1s ease-in-out;
        }

        .login-card input, .login-card select { 
            width: 100%; padding: 11px; margin-top: 6px; margin-bottom: 12px;
            background: #111724; border: 1px solid #2a364f; 
            border-radius: 8px; font-size: 14px; color: #ffffff; outline: none;
        }
        .login-card select option { background: #111724; color: #fff; }

        /* PASSWORD EYE TOGGLE WRAPPER */
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper input {
            padding-right: 40px;
        }
        .toggle-password-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-60%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 18px;
            user-select: none;
        }
        .toggle-password-btn:hover { color: var(--primary-accent); }

        .btn-login { 
            width: 100%; background: linear-gradient(135deg, #00c853, #00e676); color: #000; border: none; padding: 12px; 
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }
        .btn-login:hover { background: #00e676; }

        .user-info-bar { display: flex; justify-content: space-between; align-items: center; background: #151d2a; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; color: #fff; border: 1px solid var(--border-color); }
        
        .brand-header-custom {
            display: grid;
            grid-template-columns: 1fr 2.5fr 1fr;
            align-items: center;
            padding: 10px 15px; border-bottom: 3px solid var(--primary-accent); margin-bottom: 12px;
            background: var(--header-bg); border-radius: 8px;
        }
        .brand-title-en { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 900; color: #fff; }
        .brand-sub-en { font-size: 11px; font-weight: 800; color: var(--primary-accent); letter-spacing: 0.5px; }
        
        .print-date-bar {
            display: flex; justify-content: space-between; font-size: 11px; font-weight: bold;
            color: var(--primary-accent); margin-bottom: 12px; background: #151d2a; padding: 6px 10px;
            border-radius: 4px; border: 1px solid var(--border-color);
        }

        .tabs { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 5px; 
            margin-bottom: 12px; 
            border-bottom: 2px solid var(--border-color); 
            padding-bottom: 6px; 
        }
        .tab-btn { 
            padding: 8px 10px; background: #182232; border: 1px solid var(--border-color); font-weight: bold; cursor: pointer; 
            border-radius: 6px; font-size: 11px; flex: 1 1 calc(12% - 5px); min-width: 110px; text-align: center; color: #ccc;
        }
        .tab-btn.active { background: var(--primary-accent); color: #000; border-color: var(--primary-accent); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        form, .section-box { background: var(--header-bg); padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 3px; }
        label { font-weight: bold; font-size: 11px; color: #ccc; }
        input, select, textarea { padding: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); border-radius: 5px; font-size: 13px; width: 100%; box-sizing: border-box; }
        
        button.btn-add { background: var(--primary-accent); color: #000; border: none; padding: 9px 12px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 13px; }
        button.btn-excel { background: #1D6F42; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        button.btn-delete { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold; }

        .table-responsive { width: 100%; overflow-x: auto; margin-top: 8px; border-radius: 6px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; min-width: 500px; background: var(--card-bg); font-size: 12px; table-layout: fixed; }
        th, td { border: 1px solid var(--border-color); padding: 6px 8px; text-align: left; word-wrap: break-word; }
        th { background-color: #152238; color: var(--primary-accent); text-align: center; }
    </style>
</head>
<body>

<canvas id="tradingBgCanvas"></canvas>

<div id="loginOverlay" class="no-print">
    <div class="login-card">
        <div class="login-slider-box">
            <img id="loginSliderImg" src="https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=600&q=80" alt="Trading Market">
        </div>
        <h2 style="color: var(--primary-accent);">🔒 System Login</h2>
        <p style="font-size: 11px; color: #888; margin-bottom: 12px;">HUSSAIN TRADERS - ERP v10.0</p>
        
        <label style="text-align: left; display: block;">Select Login User:</label>
        <select id="loginUserSelect">
            <option value="admin">admin</option>
        </select>
        
        <label style="text-align: left; display: block; margin-top: 5px;">Password:</label>
        <div class="password-wrapper">
            <input type="password" id="loginPass" placeholder="Enter Password" value="admin">
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('loginPass', this)">👁️</button>
        </div>
        
        <button class="btn-login" style="margin-top: 10px;" onclick="attemptLogin()">Sign In (بِسمِ اللّٰهِ)</button>
    </div>
</div>

<div class="container">
    <div class="user-info-bar no-print">
        <div>👤 Active User: <strong id="loggedUsername">ADMIN</strong> (<span id="userRoleBadge">Admin</span>)</div>
        <div>
            <button class="btn-delete" onclick="logout()">Logout 🚪</button>
        </div>
    </div>

    <div class="brand-header-custom">
        <div>
            <img src="Gemini_Generated_Image_mrfbflmrfbflmrfb.jpeg" alt="Hussain Traders Logo" class="brand-logo" onerror="this.style.display='none'">
        </div>
        <div>
            <div class="urdu-title-main">حُسَیْن ٹْرِیَڈَرْزْ</div>
        </div>
        <div style="text-align: right;">
            <div class="brand-title-en">HUSSAIN TRADERS</div>
            <div class="brand-sub-en">ERP & MARKET SYSTEM</div>
        </div>
    </div>

    <div style="padding: 20px; text-align: center;">
        <h3>سسٹم لاگ ان ہو چکا ہے۔</h3>
        <p>آپ **admin / admin** کا استعمال کر کے لاگ ان ہو سکتے ہیں۔</p>
    </div>
</div>

<script>
    // INITIAL USERS SETUP WITH DEFAULT ADMIN ONLY
    let dbUsers = JSON.parse(localStorage.getItem('ht_users')) || [
        { username: 'admin', pass: 'admin', role: 'Admin', perms: ['all'] }
    ];

    let currentUser = dbUsers[0];

    window.onload = function() {
        populateUserLoginDropdown();
    };

    function populateUserLoginDropdown() {
        const sel = document.getElementById('loginUserSelect');
        if(sel) {
            sel.innerHTML = dbUsers.map(u => `<option value="${u.username}">${u.username}</option>`).join('');
            sel.value = 'admin';
        }
        document.getElementById('loginPass').value = 'admin';
    }

    function attemptLogin() {
        const username = document.getElementById('loginUserSelect').value;
        const pass = document.getElementById('loginPass').value;
        const found = dbUsers.find(u => u.username === username && u.pass === pass);

        if (found) {
            currentUser = found;
            document.getElementById('loggedUsername').innerText = found.username.toUpperCase();
            document.getElementById('userRoleBadge').innerText = found.role;
            document.getElementById('loginOverlay').style.display = 'none';
        } else {
            alert('غلط پاسورڈ! درست پاسورڈ درج کریں۔ (Default: admin)');
        }
    }

    function logout() {
        document.getElementById('loginOverlay').style.display = 'flex';
    }

    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            btn.innerText = "🙈";
        } else {
            input.type = "password";
            btn.innerText = "👁️";
        }
    }
</script>
</body>
</html>
